<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&display=swap" rel="stylesheet">
<style>@keyframes chsun{0%,100%{box-shadow:0 0 50px 8px rgba(156,83,62,.3)}50%{box-shadow:0 0 80px 16px rgba(156,83,62,.46)}}</style>
</helmet>
<section style="position:relative;overflow:hidden;background:linear-gradient(180deg,#43473a 0%,#4A4E3F 40%,#575a49 100%);padding:56px 40px 84px;text-align:center;font-family:'Hanken Grotesk',sans-serif">
  <div style="position:absolute;top:8%;left:50%;transform:translateX(-50%);width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#d59a86,#9C533E);animation:chsun 6s ease-in-out infinite"></div>
  <div style="position:absolute;left:-15%;right:-15%;bottom:-4%;height:46%;background:#3a3d31;border-radius:58% 62% 0 0/92% 88% 0 0"></div>
  <div style="position:absolute;left:-18%;right:-8%;bottom:-8%;height:36%;background:#2e3128;border-radius:52% 60% 0 0/88% 90% 0 0"></div>
  <div style="position:absolute;left:16%;bottom:30%;display:flex;align-items:flex-end;gap:7px;opacity:.42"><div style="width:26px;height:56px;background:#242719;border-radius:13px 13px 0 0"></div><div style="width:34px;height:84px;background:#242719;border-radius:17px 17px 0 0"></div><div style="width:22px;height:46px;background:#242719;border-radius:11px 11px 0 0"></div></div>
  <div style="position:relative;z-index:2;max-width:640px;margin:0 auto">
    <div style="font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d59a86;margin-bottom:14px">{{ kicker }}</div>
    <h1 style="font-family:'Fraunces',serif;font-weight:400;font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-.02em;color:#F6EFE0;margin:0 0 14px;text-wrap:balance">{{ title }}</h1>
    <p style="font-size:16.5px;line-height:1.55;color:rgba(246,239,224,.82);max-width:520px;margin:0 auto;text-wrap:pretty">{{ subtitle }}</p>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1240,&quot;height&quot;:300},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Calma Trip · Tunisie&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Titre de page&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sous-titre de la page.&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
